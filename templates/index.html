<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>新闻抓取结果 - 日期选择</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        h1 { color: #2c3e50; }
        ul { list-style: none; padding: 0; }
        li { margin: 1em 0; }
        a { text-decoration: none; color: #2980b9; font-size: 1.2em; }
        a:hover { color: #e67e22; }
    </style>
</head>
<body>
    <h1>新闻抓取结果 - 选择日期</h1>
    <ul>
        {% for date in dates %}
        <li><a href="/date/{{ date }}">{{ date }}</a></li>
        {% else %}
        <li>暂无数据</li>
        {% endfor %}
    </ul>
</body>
</html>
