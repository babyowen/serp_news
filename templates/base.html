<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}新闻采集系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #4f6ef7;
            --accent-hover: #3b57d9;
            --surface: #ffffff;
            --surface-alt: #f5f7fa;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
        }
        body {
            background: var(--surface-alt);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        /* 导航栏 */
        .navbar {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%) !important;
            box-shadow: 0 1px 3px rgba(0,0,0,.15);
            padding: .6rem 1rem;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: .3px;
        }
        .navbar-brand i { opacity: .7; margin-right: 6px; }
        .navbar .nav-link {
            color: rgba(255,255,255,.7) !important;
            font-size: .9rem;
            padding: .5rem .8rem !important;
            border-radius: 6px;
            transition: background .15s, color .15s;
        }
        .navbar .nav-link:hover { color: #fff !important; background: rgba(255,255,255,.1); }
        .navbar .nav-link.active {
            color: #fff !important;
            background: rgba(255,255,255,.15);
            font-weight: 500;
        }
        .navbar .nav-link i { margin-right: 4px; }

        /* 容器 */
        .content { padding: 1.5rem 0 3rem; }

        /* 卡片 */
        .card {
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            background: var(--surface);
        }
        .card-header {
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: .9rem;
            padding: .7rem 1rem;
        }
        .card-body { padding: 1rem; }

        /* 表格 */
        .table thead th {
            font-size: .82rem;
            letter-spacing: .5px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--accent);
            font-weight: 600;
            padding: .65rem .75rem;
            background: transparent;
            white-space: nowrap;
        }
        .table td { font-size: .88rem; vertical-align: middle; }
        .table-hover tbody tr:hover { background: #f0f5ff; }

        /* 统计卡片 */
        .stat-card {
            border: none;
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            transition: box-shadow .15s, transform .15s;
        }
        .stat-card:hover {
            box-shadow: 0 4px 12px rgba(79,110,247,.12);
            transform: translateY(-1px);
        }
        .stat-card .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.2;
        }
        .stat-card .stat-label {
            font-size: .76rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Pill tabs */
        .nav-pills .nav-link {
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 1px 2px rgba(0,0,0,.05);
            transition: all .15s;
        }
        .nav-pills .nav-link:hover {
            background: var(--surface-alt);
            color: var(--text);
        }
        .nav-pills .nav-link.active {
            background: var(--accent) !important;
            border-color: var(--accent);
            color: #fff !important;
        }

        /* Badge */
        .badge { font-weight: 500; font-size: .78em; }

        /* 按钮 */
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* 链接 */
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }

        /* 分隔线 */
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
            padding-bottom: .5rem;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
        }

        /* 代码块 */
        code {
            background: #f1f5f9;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: .85em;
            color: #d63384;
        }
        pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        /* 响应式微调 */
        @media (max-width: 768px) {
            .content { padding: 1rem .5rem 2rem; }
            .card { border-radius: 8px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-newspaper"></i>新闻采集系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-grid-1x2"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/database' in request.path %}active{% endif %}" href="/database">
                            <i class="bi bi-database"></i>数据库
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle {% if '/admin' in request.path %}active{% endif %}"
                           data-bs-toggle="dropdown" href="#" role="button">
                            <i class="bi bi-gear"></i>管理
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/admin/runs"><i class="bi bi-activity me-2"></i>运行监控</a></li>
                            <li><a class="dropdown-item" href="/admin/keywords"><i class="bi bi-tags me-2"></i>关键词管理</a></li>
                            <li><a class="dropdown-item" href="/admin/models"><i class="bi bi-cpu me-2"></i>模型配置</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container content">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
