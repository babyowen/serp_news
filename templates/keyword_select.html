{% extends "base.html" %}
{% block title %}选择关键词 - {{ date }}{% endblock %}
{% block content %}
<a href="/" class="btn btn-outline-secondary mb-3">&larr; 返回日期选择</a>
<h2>选择关键词 - {{ date }}</h2>
<div class="list-group">
{% for kw in keywords %}
    <a href="/date/{{ date }}?keyword={{ kw }}" class="list-group-item list-group-item-action">{{ kw }}</a>
{% else %}
    <div class="list-group-item text-muted">暂无关键词</div>
{% endfor %}
</div>
{% endblock %}
